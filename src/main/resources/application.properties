spring.application.name=image-storage-service
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/image_storage}
spring.datasource.username=${DB_USERNAME:docker-db}
spring.datasource.password=${DB_PASSWORD:sourabh123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

aws.region=ap-south-1
aws.s3.bucket-name=ai-tax-agent-document
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
