services:
  postgresql:
    image: postgres:16
    container_name: postgresql-dev
    environment:
      POSTGRES_DB: image_storage
      POSTGRES_USER: docker-db
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker-db -d image_storage"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
